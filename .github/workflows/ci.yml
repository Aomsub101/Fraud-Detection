name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      # XGBoost/LightGBM wheels dynamically link the OpenMP runtime. It is
      # normally present on ubuntu-latest, but install it explicitly so the
      # model tests never fail with "libgomp.so.1: cannot open shared object".
      - name: Install system libs (OpenMP runtime)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint (Ruff)
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest -q
